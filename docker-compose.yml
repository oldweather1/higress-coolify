services:
  higress:
    # Exact image already running on the VPS, not an upgrade via mutable latest.
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one@sha256:113ea2a6a673f627b13338bf399d42322b85ccbdd9ddc7f521fa6557d4cf7423
    restart: unless-stopped
    environment:
      MODE: full
      O11Y: "off"
      USE_PLUGIN_SERVER: "on"
    volumes:
      - higress_data:/data
    expose:
      - "8001"
      - "8080"
      - "8443"

volumes:
  higress_data:
